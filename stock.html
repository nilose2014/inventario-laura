<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stock - Mundo Azul</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <style>
    :root{
      --bg:#eef3ff;
      --card:#ffffff;
      --text:#0f172a;
      --muted:#64748b;
      --border:#dbe4f0;
      --blue:#2563eb;
      --blue2:#4f46e5;
      --green:#16a34a;
      --red:#dc2626;
      --amber:#f59e0b;
      --shadow:0 14px 32px rgba(15,23,42,.10);
      --shadow-sm:0 8px 20px rgba(15,23,42,.08);
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      font-family:Inter,Segoe UI,Arial,sans-serif;
      color:var(--text);
      background:
        radial-gradient(circle at 0% 0%, rgba(37,99,235,.10), transparent 26%),
        radial-gradient(circle at 100% 0%, rgba(124,58,237,.10), transparent 24%),
        linear-gradient(180deg,#f8fbff 0%, #edf3fb 100%);
      padding:24px;
    }

    .hidden{display:none !important}

    .stock-shell{
      max-width:980px;
      margin:0 auto;
    }

    .stock-header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:16px;
      flex-wrap:wrap;
      padding:22px 24px;
      border-radius:28px;
      margin-bottom:22px;
      background:
        radial-gradient(circle at 12% 18%, rgba(255,255,255,.22), transparent 16%),
        radial-gradient(circle at 88% 20%, rgba(255,255,255,.14), transparent 18%),
        linear-gradient(135deg,#1d4ed8 0%, #2563eb 45%, #4f46e5 100%);
      box-shadow:0 24px 56px rgba(37,99,235,.25);
      color:#fff;
    }

    .stock-header-left{
      display:flex;
      align-items:center;
      gap:16px;
      min-width:0;
    }

    .stock-logo{
      width:82px;
      height:82px;
      object-fit:contain;
      background:rgba(255,255,255,.14);
      border-radius:18px;
      padding:8px;
      flex-shrink:0;
    }

    .stock-header h1{
      margin:0;
      font-size:34px;
      line-height:1.1;
      letter-spacing:-.03em;
    }

    .stock-header p{
      margin:7px 0 0 0;
      color:rgba(255,255,255,.9);
      font-weight:700;
    }

    .card{
      background:rgba(255,255,255,.92);
      border:1px solid rgba(255,255,255,.7);
      border-radius:24px;
      padding:20px;
      margin-bottom:18px;
      box-shadow:var(--shadow);
    }

    .login-card{
      max-width:520px;
      margin:0 auto 20px auto;
      background:linear-gradient(180deg,#fff7ed,#fffbeb);
      border:1px solid #fed7aa;
    }

    .login-grid{
      display:grid;
      gap:12px;
      margin-top:14px;
    }

    label{
      display:block;
      font-size:13px;
      font-weight:900;
      color:#334155;
      margin-bottom:6px;
    }

    input{
      width:100%;
      min-height:46px;
      padding:11px 14px;
      border-radius:14px;
      border:1px solid var(--border);
      background:#fff;
      color:var(--text);
      font-size:14px;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.8);
    }

    input:focus{
      outline:none;
      border-color:#93c5fd;
      box-shadow:0 0 0 4px rgba(37,99,235,.12);
    }

    button,
    .btn-link{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:6px;
      padding:10px 14px;
      border:none;
      border-radius:14px;
      background:linear-gradient(135deg,var(--blue),var(--blue2));
      color:#fff;
      cursor:pointer;
      font-weight:900;
      font-size:13px;
      text-decoration:none;
      box-shadow:0 8px 18px rgba(37,99,235,.18);
    }

    button:hover,
    .btn-link:hover{
      filter:saturate(1.06);
      transform:translateY(-1px);
    }

    .red{background:linear-gradient(135deg,#ef4444,#dc2626)}
    .green{background:linear-gradient(135deg,#22c55e,#16a34a)}

    #status{
      padding:14px 16px;
      border-radius:16px;
      font-weight:900;
      margin-bottom:18px;
      box-shadow:var(--shadow-sm);
    }

    .admin{
      background:linear-gradient(180deg,#ecfdf5,#d1fae5);
      color:#065f46;
      border:1px solid #a7f3d0;
    }

    .user{
      background:linear-gradient(180deg,#eff6ff,#dbeafe);
      color:#1d4ed8;
      border:1px solid #bfdbfe;
    }

    .error{
      background:linear-gradient(180deg,#fef2f2,#fee2e2);
      color:#991b1b;
      border:1px solid #fecaca;
    }

    .stock-toolbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      flex-wrap:wrap;
    }

    .stock-counters{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }

    .counter-pill{
      padding:10px 14px;
      border-radius:999px;
      background:#fff;
      border:1px solid var(--border);
      font-weight:900;
      color:#334155;
      box-shadow:0 6px 14px rgba(15,23,42,.05);
    }

    .counter-pill.green{
      background:#dcfce7;
      color:#166534;
      border-color:#bbf7d0;
    }

    .table-wrap{
      overflow:auto;
      border-radius:18px;
      border:1px solid var(--border);
      background:#fff;
    }

    table{
      width:100%;
      border-collapse:collapse;
      min-width:420px;
    }

    th,td{
      padding:14px 16px;
      border-bottom:1px solid var(--border);
      text-align:left;
    }

    th{
      background:linear-gradient(180deg,#eff6ff,#dbeafe);
      color:#1e3a8a;
      font-size:13px;
      text-transform:uppercase;
      letter-spacing:.04em;
      position:sticky;
      top:0;
      z-index:1;
    }

    td{
      font-weight:800;
      color:#1f2937;
    }

    tr:last-child td{border-bottom:none}
    tr:hover td{background:#f8fbff}

    .stock-number{
      width:120px;
      text-align:center;
      font-size:18px;
      font-weight:1000;
    }

    .stock-ok{color:var(--green)}
    .stock-low{color:var(--amber)}
    .stock-zero{color:var(--red)}

    .empty-state{
      padding:28px;
      text-align:center;
      color:var(--muted);
      font-weight:900;
    }

    @media (max-width:700px){
      body{padding:14px}
      .stock-header{padding:18px}
      .stock-header-left{align-items:flex-start}
      .stock-logo{width:64px;height:64px}
      .stock-header h1{font-size:28px}
      .stock-toolbar{align-items:stretch}
      .stock-toolbar input{width:100%}
      .stock-counters{width:100%}
      .counter-pill{flex:1;text-align:center}
      th,td{padding:12px 10px}
    }
  </style>
</head>
<body>
  <div class="stock-shell">
    <header class="stock-header">
      <div class="stock-header-left">
        <img src="logo.png" class="stock-logo" alt="Mundo Azul">
        <div>
          <h1>📦 Stock</h1>
          <p>Vista rápida con solo nombre del producto y stock.</p>
        </div>
      </div>
      <a href="index.html" class="btn-link">⬅️ Volver</a>
    </header>

    <div class="card login-card" id="loginDiv">
      <h2>🔐 Iniciar sesión</h2>
      <p>Acceso para administradores y usuarios registrados.</p>
      <div class="login-grid">
        <div>
          <label for="userEmail">Email</label>
          <input id="userEmail" type="email" placeholder="Email" list="userList" autocomplete="username">
        </div>
        <div>
          <label for="userPass">Contraseña</label>
          <input id="userPass" type="password" placeholder="Contraseña" autocomplete="current-password">
        </div>
      </div>
      <datalist id="userList">
        <option value="nilose2014@gmail.com">ADMIN</option>
        <option value="djsubixj@gmail.com">Usuario</option>
        <option value="xiomaralamasmala@gmail.com">Usuario</option>
      </datalist>
      <p>
        <button onclick="login()">Entrar</button>
        <button class="red" onclick="resetLogin()">Limpiar</button>
      </p>
      <div id="loginStatus"></div>
    </div>

    <main id="stockApp" class="hidden">
      <div id="status" class="error">Cargando...</div>

      <section class="card">
        <div class="stock-toolbar">
          <input id="buscarStock" placeholder="Buscar producto..." oninput="renderStock()">
          <div class="stock-counters">
            <div class="counter-pill" id="totalProductos">0 productos</div>
            <div class="counter-pill green" id="totalStock">Stock total: 0</div>
          </div>
          <button onclick="renderStock()">🔄 Actualizar</button>
        </div>
      </section>

      <section class="card">
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Producto</th>
                <th class="stock-number">Stock</th>
              </tr>
            </thead>
            <tbody id="stockTabla"></tbody>
          </table>
        </div>
        <div id="stockEmpty" class="empty-state hidden">No hay productos para mostrar.</div>
      </section>
    </main>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBYKEUjEi8TDwJ79l1QU67BNAPn7QOsKV4",
      authDomain: "inventario-laura.firebaseapp.com",
      databaseURL: "https://inventario-laura-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "inventario-laura",
      storageBucket: "inventario-laura.firebasestorage.app",
      messagingSenderId: "778807935660",
      appId: "1:778807935660:web:947e223465f9347b17d509"
    };

    const ADMIN_EMAIL = 'nilose2014@gmail.com';
    const USER_EMAILS = ['djsubixj@gmail.com', 'xiomaralamasmala@gmail.com'];

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);
    const productosRef = ref(db, 'productos');

    let productos = {};
    let currentUser = null;
    let userRole = null;
    let listenerIniciado = false;

    function escaparHtml(texto = '') {
      return String(texto)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function getRole(email = '') {
      const emailNormalizado = String(email || '').trim().toLowerCase();
      if (emailNormalizado === ADMIN_EMAIL) return 'admin';
      if (USER_EMAILS.includes(emailNormalizado)) return 'user';
      return null;
    }

    function setStatus(tipo, html) {
      const status = document.getElementById('status');
      status.className = tipo;
      status.innerHTML = html;
    }

    function actualizarAcceso() {
      const loginDiv = document.getElementById('loginDiv');
      const stockApp = document.getElementById('stockApp');

      if (!currentUser || !userRole) {
        stockApp.classList.add('hidden');
        loginDiv.classList.remove('hidden');
        return;
      }

      loginDiv.classList.add('hidden');
      stockApp.classList.remove('hidden');

      if (userRole === 'admin') {
        setStatus('admin', `👑 <strong>ADMIN:</strong> ${escaparHtml(currentUser.email)}<br>Vista de stock activada.`);
      } else {
        setStatus('user', `👤 <strong>USUARIO:</strong> ${escaparHtml(currentUser.email)}<br>Vista de stock activada.`);
      }

      cargarStock();
    }

    function cargarStock() {
      if (listenerIniciado) return;
      listenerIniciado = true;

      onValue(productosRef, (snap) => {
        productos = snap.val() || {};
        renderStock();
      }, (error) => {
        setStatus('error', '✖ Error cargando stock: ' + escaparHtml(error.message));
      });
    }

    window.renderStock = () => {
      const tbody = document.getElementById('stockTabla');
      const empty = document.getElementById('stockEmpty');
      const totalProductos = document.getElementById('totalProductos');
      const totalStock = document.getElementById('totalStock');
      const filtro = document.getElementById('buscarStock').value.trim().toLowerCase();

      const lista = Object.entries(productos || {})
        .map(([id, p]) => ({
          id,
          nombre: String(p?.nombre || '').trim(),
          stock: Number(p?.stock || 0)
        }))
        .filter(p => p.nombre)
        .filter(p => !filtro || p.nombre.toLowerCase().includes(filtro))
        .sort((a, b) => a.nombre.localeCompare(b.nombre, 'es'));

      const sumaStock = lista.reduce((acc, p) => acc + p.stock, 0);
      totalProductos.textContent = `${lista.length} producto${lista.length === 1 ? '' : 's'}`;
      totalStock.textContent = `Stock total: ${sumaStock}`;

      if (!lista.length) {
        tbody.innerHTML = '';
        empty.classList.remove('hidden');
        return;
      }

      empty.classList.add('hidden');
      tbody.innerHTML = lista.map(p => {
        const stockClass = p.stock <= 0 ? 'stock-zero' : p.stock <= 5 ? 'stock-low' : 'stock-ok';
        return `
          <tr>
            <td>${escaparHtml(p.nombre)}</td>
            <td class="stock-number ${stockClass}">${p.stock}</td>
          </tr>
        `;
      }).join('');
    };

    window.login = () => {
      const email = document.getElementById('userEmail').value.trim();
      const pass = document.getElementById('userPass').value;
      const loginStatus = document.getElementById('loginStatus');

      if (!email || !pass) {
        loginStatus.innerHTML = '<p class="error">✖ Email y contraseña requeridos</p>';
        return;
      }

      signInWithEmailAndPassword(auth, email, pass).catch(e => {
        loginStatus.innerHTML = `<p class="error">✖ Error: ${escaparHtml(e.message)}</p>`;
      });
    };

    window.resetLogin = () => {
      document.getElementById('userEmail').value = '';
      document.getElementById('userPass').value = '';
      document.getElementById('loginStatus').innerHTML = '';
    };

    window.logout = () => signOut(auth);

    document.getElementById('userPass').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') login();
    });

    document.getElementById('userEmail').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') login();
    });

    onAuthStateChanged(auth, (user) => {
      currentUser = user;
      userRole = user ? getRole(user.email) : null;

      if (user && !userRole) {
        setStatus('error', '✖ Esta cuenta no tiene permiso para ver Stock.');
        signOut(auth).catch(() => {});
        return;
      }

      actualizarAcceso();
    });
  </script>
</body>
</html>
