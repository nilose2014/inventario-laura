<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LOGS - Inventario Laura</title>
  <style>
    body{font-family:Arial,Helvetica,sans-serif;background:#f0f2f5;padding:20px;max-width:1400px;margin:0 auto}
    .card{background:#fff;padding:20px;border-radius:10px;margin-bottom:20px;box-shadow:0 4px 6px rgba(0,0,0,.1)}
    .login-card{background:#fff3cd;border:2px solid #ffeaa7}
    .hidden{display:none}
    #status{padding:15px;margin-bottom:20px;border-radius:8px;text-align:center;font-weight:bold;font-size:16px}
    .admin{background:#d4edda;color:#155724;border:2px solid #c3e6cb}
    .error{background:#f8d7da;color:#721c24;border:2px solid #f5c6cb}
    .filtros-logs{display:flex;gap:10px;align-items:center;margin-bottom:15px;flex-wrap:wrap}
    #logBuscar,#logTipo,#logFechaDesde,#logFechaHasta{padding:8px;border:1px solid #ddd;border-radius:5px}
    #logBuscar{width:240px}
    button{padding:8px 14px;border:none;border-radius:5px;background:#007bff;color:#fff;cursor:pointer;font-weight:bold}
    button:hover{background:#0056b3}
    .red{background:#dc3545}
    .red:hover{background:#c82333}
    .debug-btn{background:#6f42c1}
    .debug-btn:hover{background:#5a32a3}
    .clean-logs{background:#dc3545}
    .clean-logs:hover{background:#c82333}
    .totales-logs{display:grid;grid-template-columns:1fr 1fr;gap:15px;text-align:center;font-size:18px;font-weight:bold;padding:15px;margin-bottom:15px;background:#f8f9fa;border-radius:10px}
    .total-bea-total{background:#d4edda;color:#155724;border:2px solid #28a745;padding:10px;border-radius:8px}
    .total-cant{background:#cce7ff;color:#004085;border:2px solid #007bff;padding:10px;border-radius:8px}
    #logCount{background:#007bff;color:#fff;padding:8px 12px;border-radius:5px;font-weight:bold;display:inline-block;margin-bottom:10px}
    .tabla-wrap{overflow:auto}
    .log-table{width:100%;border-collapse:collapse;font-size:12px;background:#fff}
    .log-table th,.log-table td{border:1px solid #ddd;padding:6px;text-align:center}
    .log-table th{background:#dc3545;color:#fff;font-size:12px;position:sticky;top:0}
    .log-table tr:nth-child(even){background:#f8f9fa}
    .log-venta{background:#d4edda !important}
    .log-reserva{background:#e8f4fd !important}
    .log-cancelacion{background:#fff3cd !important}
    .log-eliminacion{background:#f8d7da !important}
    .log-tipico{background:#e2e3e5 !important}
    .log-tipo{font-weight:bold;font-size:11px;padding:2px 6px;border-radius:3px;display:inline-block}
    .tipo-venta{background:#28a745;color:#fff}
    .tipo-reserva{background:#17a2b8;color:#fff}
    .tipo-cancel-reserva{background:#ffc107;color:#000}
    .tipo-elim-venta{background:#dc3545;color:#fff}
    .tipo-backup{background:#6f42c1;color:#fff}
    .tipo-stock{background:#20c997;color:#fff}
    .tipo-precio{background:#007bff;color:#fff}
    .tipo-reset{background:#343a40;color:#fff}
    .empty-state{padding:25px;text-align:center;color:#6b7280;font-weight:bold}
    @media (max-width:800px){
      body{padding:10px}
      .totales-logs{grid-template-columns:1fr}
    }
  </style>
</head>
<body>

  <div class="card login-card" id="loginDiv">
    <h3>Iniciar Sesión</h3>
    <input id="userEmail" type="email" placeholder="Email" list="userList"><br>
    <input id="userPass" type="password" placeholder="Contraseña"><br><br>
    <datalist id="userList">
      <option value="nilose2014@gmail.com">ADMIN</option>
    </datalist>
    <button onclick="login()">Entrar</button>
    <button class="red" onclick="resetLogin()">Limpiar</button>
  </div>

  <div id="mainApp" class="hidden">
    <div id="status">Cargando...</div>

    <div class="card">
      <h2>HISTORIAL COMPLETO DE MOVIMIENTOS</h2>

      <div class="filtros-logs">
        <input id="logBuscar" placeholder="Buscar producto/usuario/detalles..." oninput="aplicarFiltros()">
        <input type="date" id="logFechaDesde" onchange="cargarLogs()">
        <input type="date" id="logFechaHasta" onchange="cargarLogs()">

        <select id="logTipo" onchange="aplicarFiltros()">
          <option value="todos">Todos los tipos</option>
          <option value="venta">Solo VENTAS</option>
          <option value="reserva">Solo RESERVAS</option>
          <option value="cancelacion-reserva">Solo CANCEL. RESERVA</option>
          <option value="eliminacion-venta">Solo ELIMINACIÓN VENTA</option>
          <option value="backup-creado">Backups creados</option>
          <option value="backup-restaurado">Backups restaurados</option>
          <option value="stock-anadido">Stock añadido</option>
          <option value="stock-modificado">Stock modificado</option>
          <option value="proximo-modificado">Próximo modificado</option>
          <option value="precio-laura">Precio Laura</option>
          <option value="precio-laura-global">Precio Laura GLOBAL</option>
          <option value="producto-creado">Producto creado</option>
          <option value="producto-editado">Producto editado</option>
          <option value="producto-borrado">Producto borrado</option>
          <option value="reset-completo">Reset COMPLETO</option>
        </select>

        <button onclick="cargarLogs()">Recargar</button>
        <button class="debug-btn" onclick="irDebug()">🔧 DEBUG</button>
        <button class="clean-logs" onclick="limpiarTodosLogs()">LIMPIAR TODOS LOGS</button>
        <div style="flex:1"></div>
        <button class="red" onclick="logout()">Cerrar Sesión</button>
      </div>

      <div class="totales-logs">
        <div class="total-bea-total">
          <strong>💰 TOTAL BEA INDEX</strong><br>
          <span id="totalBeaIndex" style="font-size:24px">0.00 €</span>
        </div>
        <div class="total-cant">
          <strong>📦 TOTAL CANTIDAD (filtrados)</strong><br>
          <span id="totalCantidadLogs" style="font-size:24px">0</span>
        </div>
      </div>

      <div id="logCount">0 movimientos encontrados</div>

      <div class="tabla-wrap">
        <table class="log-table">
          <thead>
            <tr>
              <th>Fecha</th>
              <th>Tipo</th>
              <th>Producto</th>
              <th>Cant.</th>
              <th>Usuario</th>
              <th>Detalles</th>
            </tr>
          </thead>
          <tbody id="tablaLogs"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
    import { getDatabase, ref, onValue, remove } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';

    const firebaseConfig = {
      apiKey: "AIzaSyBYKEUjEi8TDwJ79l1QU67BNAPn7QOsKV4",
      authDomain: "inventario-laura.firebaseapp.com",
      databaseURL: "https://inventario-laura-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "inventario-laura",
      storageBucket: "inventario-laura.firebasestorage.app",
      messagingSenderId: "778807935660",
      appId: "1:778807935660:web:947e223465f9347b17d509"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);

    const logsRef = ref(db, 'logs');
    const productosRef = ref(db, 'productos');

    let todosLogs = [];
    let todosProductos = {};

    function tipoClase(tipo){
      switch(tipo){
        case 'venta': return ['tipo-venta','log-venta'];
        case 'reserva': return ['tipo-reserva','log-reserva'];
        case 'cancelacion-reserva': return ['tipo-cancel-reserva','log-cancelacion'];
        case 'eliminacion-venta': return ['tipo-elim-venta','log-eliminacion'];
        case 'backup-creado':
        case 'backup-restaurado': return ['tipo-backup','log-tipico'];
        case 'stock-anadido':
        case 'stock-modificado':
        case 'proximo-modificado': return ['tipo-stock','log-tipico'];
        case 'precio-laura':
        case 'precio-laura-global':
        case 'producto-creado':
        case 'producto-editado':
        case 'producto-borrado': return ['tipo-precio','log-tipico'];
        case 'reset-completo': return ['tipo-reset','log-tipico'];
        default: return ['',''];
      }
    }

    function actualizarTotalBea(){
      let totalBea = 0;
      Object.values(todosProductos || {}).forEach(p => {
        totalBea += Number(p?.bea || 0);
      });
      document.getElementById('totalBeaIndex').textContent = totalBea.toFixed(2) + ' €';
    }

    function actualizarTotalCantidad(logs){
      const total = logs.reduce((acc, log) => acc + Number(log?.cantidad || 0), 0);
      document.getElementById('totalCantidadLogs').textContent = total.toLocaleString('es-ES');
    }

    function renderLogs(logs){
      const tabla = document.getElementById('tablaLogs');
      const count = document.getElementById('logCount');

      actualizarTotalCantidad(logs);

      if (!logs.length){
        tabla.innerHTML = '<tr><td colspan="6" class="empty-state">No hay logs con esos filtros</td></tr>';
        count.textContent = '0 movimientos encontrados';
        return;
      }

      let html = '';
      for (const log of logs){
        const [claseTipo, claseFila] = tipoClase(log.tipo || '');
        html += `
          <tr class="${claseFila}">
            <td>${log.fecha || ''}</td>
            <td><span class="log-tipo ${claseTipo}">${String(log.tipo || '').replace(/-/g,' ').toUpperCase()}</span></td>
            <td style="text-align:left">${log.productoNombre || ''}</td>
            <td>${Number(log.cantidad || 0)}</td>
            <td>${log.usuario || ''}</td>
            <td style="text-align:left;font-size:11px">${log.detalles || ''}</td>
          </tr>
        `;
      }

      tabla.innerHTML = html;
      count.textContent = `${logs.length} movimientos encontrados`;
    }

    window.aplicarFiltros = () => {
      const texto = (document.getElementById('logBuscar').value || '').toLowerCase().trim();
      const tipo = document.getElementById('logTipo').value;

      const filtrados = todosLogs.filter(log => {
        const coincideTexto =
          (log.productoNombre || '').toLowerCase().includes(texto) ||
          (log.usuario || '').toLowerCase().includes(texto) ||
          (log.detalles || '').toLowerCase().includes(texto) ||
          (log.tipo || '').toLowerCase().includes(texto);

        const coincideTipo = tipo === 'todos' || log.tipo === tipo;
        return coincideTexto && coincideTipo;
      });

      renderLogs(filtrados);
    };

    window.cargarLogs = () => {
      const desde = document.getElementById('logFechaDesde').value;
      const hasta = document.getElementById('logFechaHasta').value;

      onValue(logsRef, (snap) => {
        const nuevosLogs = [];

        snap.forEach(child => {
          const log = child.val() || {};
          const timestamp = Number(log.timestamp || 0);
          if (!timestamp) return;

          const fechaObj = new Date(timestamp);
          const fechaStr = fechaObj.toISOString().split('T')[0];

          if ((desde === '' || fechaStr >= desde) && (hasta === '' || fechaStr <= hasta)) {
            nuevosLogs.push({
              key: child.key,
              ...log,
              fecha: log.fecha || fechaObj.toLocaleString('es-ES'),
              productoNombre: log.productoNombre || '',
              usuario: log.usuario || '',
              detalles: log.detalles || '',
              cantidad: Number(log.cantidad || 0),
              tipo: log.tipo || ''
            });
          }
        });

        nuevosLogs.sort((a,b) => Number(b.timestamp || 0) - Number(a.timestamp || 0));
        todosLogs = nuevosLogs;
        aplicarFiltros();
      }, (error) => {
        const status = document.getElementById('status');
        status.className = 'error';
        status.textContent = '❌ Error cargando logs: ' + error.message;
      });
    };

    window.login = () => {
      const email = document.getElementById('userEmail').value.trim();
      const pass = document.getElementById('userPass').value;
      if (!email || !pass) return alert('Email y contraseña requeridos');
      signInWithEmailAndPassword(auth, email, pass).catch(e => alert('Error: ' + e.message));
    };

    window.logout = () => {
      signOut(auth).catch(e => alert('Error: ' + e.message));
    };

    window.resetLogin = () => {
      document.getElementById('userEmail').value = '';
      document.getElementById('userPass').value = '';
    };

    window.irDebug = () => {
      window.open('https://nilose2014.github.io/inventario-laura/debug.html', '_blank');
    };

    window.limpiarTodosLogs = async () => {
      if (!confirm('⚠️ ¿BORRAR TODOS los logs permanentemente?\n\nEsta acción NO se puede deshacer.')) return;
      try {
        await remove(logsRef);
        todosLogs = [];
        renderLogs([]);
        alert('✅ TODOS los logs han sido eliminados');
      } catch (error) {
        alert('❌ Error al limpiar logs: ' + error.message);
      }
    };

    onValue(productosRef, (snap) => {
      todosProductos = snap.val() || {};
      actualizarTotalBea();
    });

    onAuthStateChanged(auth, (user) => {
      const loginDiv = document.getElementById('loginDiv');
      const mainApp = document.getElementById('mainApp');
      const status = document.getElementById('status');

      if (user && user.email === 'nilose2014@gmail.com') {
        loginDiv.classList.add('hidden');
        mainApp.classList.remove('hidden');
        status.className = 'admin';
        status.innerHTML = `<strong>ADMIN</strong> ${user.email}<br>Logs cargando...`;
        cargarLogs();
      } else {
        mainApp.classList.add('hidden');
        loginDiv.classList.remove('hidden');
      }
    });

    window.onload = () => {
      const hoy = new Date().toISOString().split('T')[0];
      const hace7dias = new Date(Date.now() - 7 * 24 * 60 * 60 * 1000).toISOString().split('T')[0];
      document.getElementById('logFechaDesde').value = hace7dias;
      document.getElementById('logFechaHasta').value = hoy;
    };
  </script>
</body>
</html>
