<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo Mundo Azul</title>

  <link rel="icon" type="image/png" href="favicon.png">

  <style>
    :root{
      --bg:#eef3ff;
      --card:#ffffff;
      --text:#0f172a;
      --muted:#64748b;
      --border:#dbe4f0;
      --shadow:0 14px 32px rgba(15,23,42,.10);
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      font-family:Inter,Segoe UI,Arial,sans-serif;
      color:var(--text);
      background:
        radial-gradient(circle at 0% 0%, rgba(37,99,235,.10), transparent 26%),
        radial-gradient(circle at 100% 0%, rgba(124,58,237,.10), transparent 24%),
        linear-gradient(180deg,#f8fbff 0%, #edf3fb 100%);
      padding:24px;
    }

    .catalog-shell{
      max-width:1400px;
      margin:0 auto;
    }

    .catalog-header{
      display:flex;
      align-items:center;
      gap:18px;
      padding:20px 24px;
      border-radius:28px;
      margin-bottom:24px;
      background:
        radial-gradient(circle at 12% 18%, rgba(255,255,255,.22), transparent 16%),
        radial-gradient(circle at 88% 20%, rgba(255,255,255,.14), transparent 18%),
        linear-gradient(135deg,#1d4ed8 0%, #2563eb 45%, #4f46e5 100%);
      box-shadow:0 24px 56px rgba(37,99,235,.25);
    }

    .catalog-logo{
      width:88px;
      height:88px;
      object-fit:contain;
      background:rgba(255,255,255,.14);
      border-radius:18px;
      padding:8px;
      flex-shrink:0;
    }

    .catalog-header h1{
      margin:0;
      color:#fff;
      font-size:34px;
      line-height:1.1;
    }

    .catalog-header p{
      margin:8px 0 0 0;
      color:rgba(255,255,255,.9);
      font-weight:600;
    }

    .catalog-topbar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      margin-bottom:18px;
      flex-wrap:wrap;
    }

    .catalog-count{
      font-weight:800;
      color:#334155;
      background:#fff;
      padding:12px 16px;
      border-radius:14px;
      border:1px solid var(--border);
      box-shadow:0 6px 14px rgba(15,23,42,.05);
    }

    .catalog-grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
      gap:18px;
    }

    .catalog-card{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:24px;
      overflow:hidden;
      box-shadow:var(--shadow);
      transition:transform .2s ease, box-shadow .2s ease;
    }

    .catalog-card:hover{
      transform:translateY(-3px);
      box-shadow:0 22px 46px rgba(15,23,42,.14);
    }

    .catalog-image-wrap{
      aspect-ratio:1/1;
      background:#f8fafc;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:14px;
    }

    .catalog-image{
      width:100%;
      height:100%;
      object-fit:cover;
      border-radius:18px;
      background:#fff;
    }

    .catalog-no-image{
      width:100%;
      height:100%;
      border:2px dashed #cbd5e1;
      border-radius:18px;
      display:flex;
      align-items:center;
      justify-content:center;
      color:var(--muted);
      font-weight:800;
      background:#fff;
    }

    .catalog-body{
      padding:16px;
      text-align:center;
    }

    .catalog-name{
      margin:0 0 12px 0;
      font-size:20px;
      line-height:1.2;
      min-height:48px;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .catalog-price{
      display:inline-block;
      padding:10px 16px;
      border-radius:999px;
      background:#111827;
      color:#fff;
      font-size:26px;
      font-weight:900;
    }

    .catalog-empty{
      background:#fff;
      border:1px solid var(--border);
      border-radius:24px;
      padding:30px;
      text-align:center;
      color:var(--muted);
      font-weight:800;
      box-shadow:var(--shadow);
    }

    @media (max-width:700px){
      body{padding:12px}

      .catalog-header{
        padding:16px;
        border-radius:22px;
      }

      .catalog-logo{
        width:64px;
        height:64px;
      }

      .catalog-header h1{
        font-size:24px;
      }
    }
  </style>
</head>
<body>
  <div class="catalog-shell">
    <header class="catalog-header">
      <img src="logo.png" alt="Logo Mundo Azul" class="catalog-logo">
      <div>
        <h1>Catálogo Mundo Azul</h1>
        <p>Nombre · Foto · Precio venta</p>
      </div>
    </header>

    <div class="catalog-topbar">
      <div class="catalog-count" id="catalogCount">Cargando catálogo...</div>
    </div>

    <section class="catalog-grid" id="catalogGrid"></section>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBYKEUjEi8TDwJ79l1QU67BNAPn7QOsKV4",
      authDomain: "inventario-laura.firebaseapp.com",
      databaseURL: "https://inventario-laura-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "inventario-laura",
      storageBucket: "inventario-laura.firebasestorage.app",
      messagingSenderId: "778807935660",
      appId: "1:778807935660:web:947e223465f9347b17d509"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    async function cargarCatalogo(){
      const grid = document.getElementById('catalogGrid');
      const count = document.getElementById('catalogCount');

      try{
        const snap = await get(ref(db, 'productos_publicos'));
        const productos = Object.values(snap.val() || {})
          .map(p => ({
            nombre: String(p?.nombre || '').trim(),
            laura: Number(p?.laura || 0),
            imagen: String(p?.imagen || '').trim()
          }))
          .filter(p => p.nombre)
          .sort((a, b) => a.nombre.localeCompare(b.nombre, 'es'));

        count.textContent = `${productos.length} productos en catálogo`;

        if (!productos.length){
          grid.innerHTML = `<div class="catalog-empty">No hay productos disponibles en el catálogo.</div>`;
          return;
        }

        grid.innerHTML = productos.map(p => `
          <article class="catalog-card">
            <div class="catalog-image-wrap">
              ${p.imagen
                ? `<img src="${p.imagen}" alt="${p.nombre.replace(/"/g, '&quot;')}" class="catalog-image">`
                : `<div class="catalog-no-image">Sin foto</div>`
              }
            </div>
            <div class="catalog-body">
              <h3 class="catalog-name">${p.nombre}</h3>
              <div class="catalog-price">€${p.laura.toFixed(2)}</div>
            </div>
          </article>
        `).join('');
      }catch(error){
        console.error(error);
        count.textContent = 'Error cargando catálogo';
        grid.innerHTML = `<div class="catalog-empty">No se pudo cargar el catálogo.</div>`;
      }
    }

    cargarCatalogo();
  </script>
</body>
</html>
