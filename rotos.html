<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rotos y faltantes</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <style>
    :root{--bg:#eef3ff;--card:#fff;--text:#0f172a;--muted:#64748b;--border:#dbe4f0;--blue:#2563eb;--blue2:#4f46e5;--red:#dc2626;--amber:#f59e0b;--shadow:0 14px 32px rgba(15,23,42,.10)}
    *{box-sizing:border-box}body{margin:0;padding:24px;font-family:Inter,Segoe UI,Arial,sans-serif;color:var(--text);background:radial-gradient(circle at 0% 0%,rgba(37,99,235,.10),transparent 26%),radial-gradient(circle at 100% 0%,rgba(124,58,237,.10),transparent 24%),linear-gradient(180deg,#f8fbff 0%,var(--bg) 100%)}
    .shell{max-width:1300px;margin:0 auto}.header{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding:22px 24px;border-radius:28px;margin-bottom:20px;background:linear-gradient(135deg,#1d4ed8 0%,#2563eb 45%,#4f46e5 100%);box-shadow:0 24px 56px rgba(37,99,235,.25);color:#fff}.header-left{display:flex;align-items:center;gap:16px}.logo{width:78px;height:78px;object-fit:contain;background:rgba(255,255,255,.14);border-radius:18px;padding:8px}.header h1{margin:0;font-size:32px}.header p{margin:7px 0 0;color:rgba(255,255,255,.9);font-weight:700}.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 14px;border:none;border-radius:14px;background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;cursor:pointer;font-weight:900;font-size:13px;text-decoration:none;box-shadow:0 8px 18px rgba(37,99,235,.18)}
    .card{background:rgba(255,255,255,.93);border:1px solid rgba(255,255,255,.7);border-radius:24px;padding:20px;margin-bottom:18px;box-shadow:var(--shadow)}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.counters{display:flex;gap:10px;flex-wrap:wrap}.pill{padding:10px 14px;border-radius:999px;background:#fff;border:1px solid var(--border);font-weight:900;color:#334155}.pill.red{background:#fee2e2;color:#991b1b;border-color:#fecaca}.pill.amber{background:#fef3c7;color:#92400e;border-color:#fde68a}input{width:100%;max-width:360px;min-height:44px;padding:10px 12px;border-radius:13px;border:1px solid var(--border);font-size:14px}
    .table-wrap{overflow:auto;border-radius:18px;border:1px solid var(--border);background:#fff}table{width:100%;border-collapse:collapse;min-width:760px}th,td{padding:12px 14px;border-bottom:1px solid var(--border);text-align:left;vertical-align:middle}th{background:linear-gradient(180deg,#eff6ff,#dbeafe);color:#1e3a8a;font-size:12px;text-transform:uppercase;letter-spacing:.04em;position:sticky;top:0;z-index:1}td{font-weight:800}.foto{width:68px;height:68px;object-fit:cover;border-radius:14px;border:1px solid var(--border);background:#f8fafc}.no-foto{width:68px;height:68px;display:flex;align-items:center;justify-content:center;border:2px dashed #cbd5e1;border-radius:14px;color:#64748b;background:#f8fafc;font-size:12px}.money{white-space:nowrap;font-weight:1000}.total-row{color:#7c2d12;font-size:16px}.empty{padding:30px;text-align:center;color:var(--muted);font-weight:900}.error{padding:14px 16px;border-radius:16px;background:#fee2e2;color:#991b1b;font-weight:900;border:1px solid #fecaca}.date{font-size:12px;color:var(--muted);font-weight:800;margin-top:8px}
    @media(max-width:720px){body{padding:14px}.header{padding:18px}.logo{width:62px;height:62px}.header h1{font-size:26px}.counters{width:100%}.pill{flex:1;text-align:center}input{max-width:none}}
    @media print{body{background:#fff!important;padding:0}.header,.toolbar input,.btn{display:none!important}.card{box-shadow:none;border:none;padding:0}.table-wrap{border:none;overflow:visible}table{min-width:0;font-size:12px}th{position:static;background:#eee!important;color:#000}.foto,.no-foto{width:42px;height:42px}.print-title{display:block!important;margin-bottom:12px}}
    .print-title{display:none}
  </style>
</head>
<body>
  <div class="shell">
    <header class="header">
      <div class="header-left"><img src="logo.png" class="logo" alt="3d"><div><h1>🛠️ Rotos y faltantes</h1><p>Consulta pública · solo lectura.</p></div></div>
      <button class="btn" onclick="window.print()">🖨️ Imprimir</button>
    </header>

    <section class="card">
      <div class="toolbar">
        <input id="buscar" placeholder="Buscar producto..." oninput="renderTabla()">
        <div class="counters">
          <div class="pill" id="totalProductos">0 productos</div>
          <div class="pill amber" id="totalUnidades">0 unidades</div>
          <div class="pill red" id="totalImporte">Total: €0.00</div>
        </div>
      </div>
      <div class="date" id="fechaActualizacion">Cargando...</div>
    </section>

    <section class="card">
      <h2 class="print-title">Rotos y faltantes</h2>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Imagen</th><th>Producto</th><th>Precio Bea</th><th>Rotos</th><th>Faltantes</th><th>Unidades</th><th>Total</th></tr></thead>
          <tbody id="tabla"></tbody>
        </table>
      </div>
      <div id="empty" class="empty">Cargando datos...</div>
    </section>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBYKEUjEi8TDwJ79l1QU67BNAPn7QOsKV4",
      authDomain: "inventario-laura.firebaseapp.com",
      databaseURL: "https://inventario-laura-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "inventario-laura",
      storageBucket: "inventario-laura.firebasestorage.app",
      messagingSenderId: "778807935660",
      appId: "1:778807935660:web:947e223465f9347b17d509"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    let datos = {};
    const eur = n => new Intl.NumberFormat('es-ES', { style:'currency', currency:'EUR' }).format(Number(n || 0));
    const escaparHtml = (texto='') => String(texto).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');

    function listaFiltrada(){
      const filtro = document.getElementById('buscar').value.trim().toLowerCase();
      return Object.entries(datos || {})
        .map(([id,p]) => ({ id, ...p, nombre:String(p?.nombre || '').trim(), imagen:String(p?.imagen || ''), bea:Number(p?.bea || 0), rotos:Number(p?.rotos || 0), faltantes:Number(p?.faltantes || 0), updatedAt:Number(p?.updatedAt || 0) }))
        .filter(p => p.nombre && (p.rotos + p.faltantes) > 0)
        .filter(p => !filtro || p.nombre.toLowerCase().includes(filtro))
        .sort((a,b) => a.nombre.localeCompare(b.nombre, 'es'));
    }

    window.renderTabla = () => {
      const lista = listaFiltrada();
      const tbody = document.getElementById('tabla');
      const empty = document.getElementById('empty');
      let totalUnidades = 0, totalImporte = 0, ultima = 0;
      if (!lista.length) {
        tbody.innerHTML = '';
        empty.style.display = 'block';
        empty.textContent = 'No hay productos con rotos o faltantes.';
        actualizarTotales(0,0,0,0);
        return;
      }
      empty.style.display = 'none';
      tbody.innerHTML = lista.map(p => {
        const unidades = Number(p.rotos || 0) + Number(p.faltantes || 0);
        const total = unidades * Number(p.bea || 0);
        totalUnidades += unidades;
        totalImporte += total;
        ultima = Math.max(ultima, Number(p.updatedAt || 0));
        const img = p.imagen ? `<img class="foto" src="${escaparHtml(p.imagen)}" alt="${escaparHtml(p.nombre)}" loading="lazy" referrerpolicy="no-referrer">` : `<div class="no-foto">Sin foto</div>`;
        return `<tr><td>${img}</td><td>${escaparHtml(p.nombre)}</td><td class="money">${eur(p.bea)}</td><td>${p.rotos}</td><td>${p.faltantes}</td><td>${unidades}</td><td class="money total-row">${eur(total)}</td></tr>`;
      }).join('');
      actualizarTotales(lista.length, totalUnidades, totalImporte, ultima);
    };

    function actualizarTotales(productos, unidades, importe, ultima){
      document.getElementById('totalProductos').textContent = `${productos} producto${productos===1?'':'s'}`;
      document.getElementById('totalUnidades').textContent = `${unidades} unidad${unidades===1?'':'es'}`;
      document.getElementById('totalImporte').textContent = `Total: ${eur(importe)}`;
      document.getElementById('fechaActualizacion').textContent = ultima ? `Última actualización: ${new Date(ultima).toLocaleString('es-ES')}` : 'Sin datos actualizados todavía.';
    }

    onValue(ref(db, 'rotos_faltantes_publicos'), snap => {
      datos = snap.val() || {};
      renderTabla();
    }, error => {
      document.getElementById('empty').innerHTML = `<div class="error">✖ No se pueden cargar los datos públicos: ${escaparHtml(error.message)}<br>Revisa las reglas de Firebase para permitir lectura en rotos_faltantes_publicos.</div>`;
    });
  </script>
</body>
</html>
